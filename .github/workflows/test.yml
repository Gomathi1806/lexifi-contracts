name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  forge:
    name: Foundry build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv
